// Manual test

syntax = "proto3";

package dawn.native.webgpu.cmd.pb;

message Block {
    repeated Cmd cmds = 1;
}

message Cmd {
    oneof type {
        DeviceCreateBufferCmd deviceCreateBuffer = 1;
        QueueWriteBufferCmd queueWriteBuffer = 2;
    }
}

// struct WGPUBufferDescriptorTransfer {
//     static_assert(0 <= 1,
//                   "Record must be at most one of is_cmd, extensible, and chained.");
//     WGPUBool hasNextInChain;

//     WGPUStringViewTransfer label;
//     WGPUBufferUsage usage;
//     uint64_t size;
//     WGPUBool mappedAtCreation;
// };

message BufferDescriptor {
    bool hasNextInChain = 1;
    string label = 2;
    uint64 usage = 3;
    uint64 size = 4;
    bool mappedAtCreation = 5;
}

message DeviceCreateBufferCmd {
    uint32 deviceId = 1;
    BufferDescriptor bufferDescriptor = 2;
    // Returned buffer object handle
    uint32 resultId = 3;
}

message QueueWriteBufferCmd {
    uint32 queueId = 1;
    uint32 bufferId = 2;
    uint64 bufferOffset = 3;
    bytes data = 4;  // data pointer and size
}
