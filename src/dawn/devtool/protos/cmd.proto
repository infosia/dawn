// TODO(crbug.com/413053623): use dawn_json_generator to generate this proto file.

syntax = "proto3";

package dawn.devtool.cmd.pb;

option optimize_for = LITE_RUNTIME;

message SnapshotDeviceState {
    uint64 id = 1;
}

message SnapshotQueueState {
    uint64 id = 1;
}

message SnapshotBufferState {
    uint64 id = 1;
}

message SnapshotGlobalState {
    SnapshotDeviceState device = 1;
    repeated SnapshotQueueState queues = 2;
    repeated SnapshotBufferState buffers = 3;
}

message Block {
    SnapshotGlobalState globalState = 1;
    repeated Cmd cmds = 15;
}

message Cmd {
    oneof type {
        DeviceCreateBufferCmd deviceCreateBuffer = 1;
        QueueWriteBufferCmd queueWriteBuffer = 2;
    }
}

message BufferDescriptor {
    bool hasNextInChain = 1;
    string label = 2;
    uint64 usage = 3;
    uint64 size = 4;
    bool mappedAtCreation = 5;
}

message DeviceCreateBufferCmd {
    uint64 deviceId = 1;
    BufferDescriptor bufferDescriptor = 2;
    uint64 resultId = 3;
}

message QueueWriteBufferCmd {
    uint64 queueId = 1;
    uint64 bufferId = 2;
    uint64 bufferOffset = 3;
    bytes data = 4;
}
