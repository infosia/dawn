name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

concurrency:
  # Use github.run_id on main branch
  # Use github.event.pull_request.number on pull requests, so it's unique per pull request
  # Use github.ref on other branches, so it's unique per branch
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cmake:
    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14]
        build_type: [Debug, Release]
        c_compiler: [gcc, clang, cl]
        include:
          - os: windows-2022
            c_compiler: cl
            cpp_compiler: cl
            container: null
          - os: ubuntu-22.04
            c_compiler: gcc
            cpp_compiler: g++
            container: dockcross/manylinux_2_28-x64:latest
          - os: macos-14
            c_compiler: clang
            cpp_compiler: clang++
            container: null
        exclude:
          - os: windows-2022
            c_compiler: clang
          - os: windows-2022
            c_compiler: gcc
          - os: ubuntu-22.04
            c_compiler: cl
          - os: ubuntu-22.04
            c_compiler: clang
          - os: macos-14
            c_compiler: cl
          - os: macos-14
            c_compiler: gcc

    name: CMake ${{ matrix.os }} ${{ matrix.build_type }} (${{ matrix.c_compiler }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    env:
      SCCACHE_GHA_ENABLED: "true"

    steps:
    - uses: actions/checkout@v4

    - name: Set up dependencies on linux
      if: matrix.container == 'dockcross/manylinux_2_28-x64:latest'
      run: >
        dnf install -y mesa-libGL-devel libxcb libxcb-devel libX11-xcb libXrandr-devel libXinerama-devel libXi-devel libXext-devel libxkbcommon libxkbcommon-devel libxkbcommon-x11-devel mesa-vulkan-drivers wayland-protocols-devel wayland-devel
  
    - name: Set up Ninja
      uses: seanmiddleditch/gha-setup-ninja@master

    - name: Set up sccache
      uses: mozilla-actions/sccache-action@v0.0.3

    - name: Configure CMake
      run: >
        cmake -G Ninja -B out/${{ matrix.build_type }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DCMAKE_C_COMPILER_LAUNCHER=sccache
        -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
        -DDAWN_FETCH_DEPENDENCIES=ON
        -DDAWN_ENABLE_INSTALL=ON
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build out/${{ matrix.build_type }} --config ${{ matrix.build_type }}

    - name: Package
      run: >
        cpack --config out/${{ matrix.build_type }}/CPackConfig.cmake
        -G ZIP
        -C ${{ matrix.build_type }}
        -B package

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: package-${{ matrix.os }}-${{ matrix.build_type }}
        path: package

  golang:
    name: Go Build and Test
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.18'

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...
